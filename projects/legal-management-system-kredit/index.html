const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];

const roll=$('#roll'),hds=$('#hds');
DATA.forEach((c,ci)=>{

  const h=document.createElement('div');h.className='hd';h.innerHTML=`${esc(c.n)}<b>${c.i.length}</b>`;hds.appendChild(h);});

function words(el){const out=[];const walk=n=>{[...n.childNodes].forEach(c=>{if(c.nodeType===3){const f=document.createDocumentFragment();
  c.textContent.split(/(\s+)/).forEach(p=>{if(!p)return;if(/^\s+$/.test(p)){f.appendChild(document.createTextNode(' '));return;}
  const s=document.createElement('span');s.className='w';s.textContent=p;f.appendChild(s);out.push(s);});n.replaceChild(f,c);}
  else if(c.nodeType===1&&c.tagName!=='BR')walk(c);});};walk(el);return out;}
const defs=$('#filters defs');let fc=0;
function blurTween(tl,el,at,from,to,dur,ease='power3.out'){const id='mb'+(fc++),f=document.createElementNS(NS,'filter');f.id=id;
  ['x','y'].forEach(k=>f.setAttribute(k,'-40%'));['width','height'].forEach(k=>f.setAttribute(k,'180%'));
  const g=document.createElementNS(NS,'feGaussianBlur');g.setAttribute('stdDeviation','0 0');f.appendChild(g);defs.appendChild(f);
  const o={v:from};tl.set(el,{filter:`url(#${id})`},at);
  tl.to(o,{v:to,duration:dur,ease,onUpdate(){g.setAttribute('stdDeviation',`${(o.v*.12).toFixed(2)} ${o.v.toFixed(2)}`);}},at);
  tl.set(el,{filter:'none'},at+dur+.01);}

const tl=gsap.timeline({paused:true});

  /* --- 0–3,5 hook --- */
  const h1=$('#hk h1');const chs=[];[...h1.childNodes].forEach(n=>{if(n.nodeType===3){const f=document.createDocumentFragment();
    [...n.textContent].forEach(ch=>{const s=document.createElement('span');s.className='ch';s.textContent=ch;f.appendChild(s);chs.push(s);});n.replaceWith(f);}});

  tl.to('#hk',{scale:.42,y:-560,opacity:0,duration:.8,ease:'power3.inOut'},3.4);

  /* --- 4–30,5 gulungan --- */
  const endY=-(CONTENT-WINH*.55);

  tl.to('#cta .btn',{scale:.93,duration:.12,ease:'power2.in'},34.25);
  tl.to('#cta .btn',{scale:1,duration:.3,ease:'back.out(3)'},34.37);

}

/* ---------- render: fungsi murni dari t ---------- */
const hdEls=()=>$$('.hd',hds);let HD=[];

    HD[i].style.visibility=(y<-HDH-20||y>WINH)?'hidden':'visible';}
  /* penghitung: file yang sudah melewati garis baca (sepertiga bawah jendela) */
  const line=WINH*.82;let n=0;for(const y of ITEMS){if(y+S.y<line)n++;else break;}
  $('#cn').textContent=n; $('#cb').style.transform=`scaleX(${(n/201).toFixed(4)})`;
  const a=t*2*Math.PI/14;
  $('#l1').style.transform=`translate(${(-300+300*Math.sin(a)).toFixed(1)}px,${(-250+260*Math.cos(a*.8)).toFixed(1)}px)`;
  $('#l2').style.transform=`translate(${(200+220*Math.cos(a*.9)).toFixed(1)}px,${(600+200*Math.sin(a*1.1)).toFixed(1)}px)`;}
tl.eventCallback('onUpdate',render);

const stage=$('#stage');function fit(){const k=Math.min(innerWidth/W,innerHeight/H);stage.style.transform=`translate(-50%,-50%) scale(${k})`;}
addEventListener('resize',fit);fit();
if(Q.has('debug'))$('#ui').classList.add('on');
tl.eventCallback('onComplete',()=>tl.play(0));
const seek=t=>{tl.pause();tl.time(t,false);render();};
window.OPENER={tl,DURATION,W,H,seek,ready:false};
addEventListener('keydown',e=>{if(e.key==='r'||e.key==='R')tl.play(0);if(e.code==='Space'){e.preventDefault();tl.paused()?tl.play():tl.pause();}});
$('#bPlay').onclick=()=>{tl.paused()?tl.play():tl.pause();$('#bPlay').textContent=tl.paused()?'Play':'Pause';};
$('#bRe').onclick=()=>tl.play(0);$('#scrub').oninput=e=>seek(e.target.value/1000*DURATION);
gsap.ticker.add(()=>{$('#clock').textContent=tl.time().toFixed(2)+'s';if(!tl.paused())$('#scrub').value=tl.time()/DURATION*1000;});
Promise.all(['500 33px Figtree','700 40px Figtree','800 70px Figtree'].map(f=>document.fonts.load(f))).then(()=>document.fonts.ready)
  .then(()=>{build();HD=hdEls();seek(0);window.OPENER.ready=true;if(!Q.has('clean'))tl.play(0);});
})();
</script>
</body>
</html>
