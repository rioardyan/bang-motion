<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Satu Tiang Tertulis</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  PROMO META ADS 4:5 (1080x1350), 44,7 detik, mengikuti audio/vo.mp3 (ElevenLabs, Finn), loop.
  Lanjutan CERITA "Yayasan Satu Tiang" untuk pengunjung halaman jualan yang belum beli.
  Visual sengaja BEDA TOTAL dari Satu Tiang: meja Ketua dilihat dari atas, siang, kayu + kertas krem.
  Naskah: naskah.md · Style brief: style-brief.md
  ?debug=1 = panel scrub · ?clean=1 = tanpa autoplay (potret/export).
  Halaman dokumen dibangun ulang dari kode (tanpa logo/brand). Isi baris = CONTOH tampilan, bukan salinan file asli.
-->
<link rel="stylesheet" href="fonts/fonts.css">
<script src="vendor/gsap.min.js"></script>
<style>
:root{
  --bg:#B9824A; --wood:#B9824A; --paper:#FBF6EA; --ink:#1F3A8A; --dark:#1C2333; --note:#FFE27A; --red:#C23B2E; --manila:#E9C98A; --xl:#1E7A4C;
  --head:'Bricolage Grotesque','Arial Black',sans-serif; --ui:'Nunito Sans',system-ui,sans-serif; --hand:'Caveat',cursive;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:var(--ui)}
#stage{position:fixed;left:50%;top:50%;width:1080px;height:1350px;transform:translate(-50%,-50%) scale(1);overflow:hidden;background:var(--wood)}

/* ---------- MEJA ---------- */
#desk{position:absolute;left:-80px;top:-80px;width:1240px;height:1510px;
  background:
   radial-gradient(ellipse 900px 700px at 30% 18%,rgba(255,236,200,.28),transparent 70%),
   radial-gradient(ellipse 1100px 900px at 50% 55%,transparent 55%,rgba(60,30,8,.38)),
   repeating-linear-gradient(1.2deg,rgba(90,52,22,0) 0 6px,rgba(90,52,22,.08) 6px 8px,rgba(90,52,22,0) 8px 15px,rgba(120,72,30,.06) 15px 16px,rgba(90,52,22,0) 16px 23px),
   repeating-linear-gradient(0deg,transparent 0 300px,rgba(70,38,12,.42) 300px 303px),
   var(--wood)}

/* ---------- ADEGAN (kamera) ---------- */
#scene{position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:540px 860px}
.ob{position:absolute;opacity:0}
.sh{box-shadow:10px 16px 0 rgba(70,38,12,.22),18px 30px 40px rgba(50,25,5,.35)}

/* papan nama */
.np{width:400px;height:100px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:800 50px var(--head);letter-spacing:.14em}
#np1{background:linear-gradient(#2E3440,#1B1F27);color:#E8C77A}
#np2{background:linear-gradient(#2A4AA6,#1F3A8A);color:var(--paper)}
.np:before{content:"";position:absolute;inset:8px;border:2px solid rgba(232,199,122,.35);border-radius:6px}
#np2:before{border-color:rgba(251,246,234,.35)}
/* buku catatan bergembok */
#nb{width:290px;height:380px;border-radius:12px 18px 18px 12px;background:linear-gradient(90deg,#1A2550,#22305E 14%,#26356A)}
#nb .lab{position:absolute;left:40px;top:58px;width:170px;padding:10px 0;border-radius:6px;background:var(--paper);color:var(--dark);font:800 19px/1.15 var(--ui);text-align:center;letter-spacing:.08em}
#nb .band{position:absolute;left:226px;top:0;bottom:0;width:18px;background:#111733}
#lock{position:absolute;left:206px;top:170px;width:58px;height:70px;transform-origin:50% 0}
#lock i{position:absolute;left:12px;top:0;width:34px;height:36px;border:8px solid #C9CED8;border-bottom:0;border-radius:18px 18px 0 0}
#lock b{position:absolute;left:0;top:26px;width:58px;height:44px;border-radius:8px;background:linear-gradient(#E6B94B,#C9962E)}
#lock b:after{content:"";position:absolute;left:24px;top:13px;width:10px;height:16px;border-radius:5px;background:#5A3D12}
/* cangkir */
#mug{width:170px;height:170px;border-radius:50%;background:#F4F1EA}
#mug:before{content:"";position:absolute;left:22px;top:22px;width:126px;height:126px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#7A4E2C,#4A2C16 70%)}
#mug:after{content:"";position:absolute;left:158px;top:58px;width:56px;height:54px;border-radius:0 28px 28px 0;border:14px solid #F4F1EA;border-left:0}
/* pena */
#pen{width:300px;height:22px;border-radius:11px;background:linear-gradient(#2B4FB5,#1F3A8A)}
#pen:before{content:"";position:absolute;left:-26px;top:5px;border:6px solid transparent;border-right:26px solid #C9CED8;border-left:0;height:0}
#pen:after{content:"";position:absolute;left:190px;top:-4px;width:90px;height:8px;border-radius:4px;background:#E6B94B}
/* catatan tempel */
.note{width:250px;height:200px;background:var(--note);display:flex;align-items:center;justify-content:center;text-align:center;font:700 50px/0.98 var(--hand);color:var(--ink);padding:0 14px;
  box-shadow:6px 10px 0 rgba(70,38,12,.18),12px 22px 26px rgba(50,25,5,.3)}
.note:before{content:"";position:absolute;left:0;right:0;top:0;height:34px;background:rgba(0,0,0,.05)}
/* map */
.fold{width:260px;height:330px;border-radius:4px 12px 12px 12px;background:linear-gradient(160deg,#F0D49A,var(--manila) 60%,#DDB977)}
.fold:before{content:"";position:absolute;left:0;top:-28px;width:120px;height:30px;border-radius:10px 10px 0 0;background:#EFD196}
.fold .num{position:absolute;left:30px;top:30px;width:84px;height:84px;border-radius:50%;background:var(--ink);color:var(--paper);font:800 56px/84px var(--head);text-align:center}
.fold .nm{position:absolute;left:28px;right:24px;bottom:34px;font:800 30px/1.02 var(--head);color:var(--dark);opacity:0}
.fold .ck{position:absolute;right:22px;top:30px;width:70px;height:70px;opacity:0}
.fold .ck path{fill:none;stroke:var(--ink);stroke-width:11;stroke-linecap:round;stroke-linejoin:round}
.fold .ln{position:absolute;left:30px;right:30px;height:6px;border-radius:3px;background:rgba(120,80,30,.2)}
/* kotak arsip */
#box{width:840px;height:340px;border-radius:10px;background:#9C6E3C;padding:22px 30px}
#box:before{content:"";position:absolute;inset:14px;border-radius:6px;background:#6E4A24}
#sliv{position:absolute;left:33px;top:66px;width:774px;height:252px}
.sv{position:absolute;bottom:0;width:3px;border-radius:1px 1px 0 0;background:#FBF6EA;opacity:0}
.sv.b{background:#E9E2CF}
.tab{position:absolute;top:-38px;width:44px;height:32px;border-radius:7px 7px 0 0;background:var(--ink);color:var(--paper);font:800 20px/32px var(--head);text-align:center;opacity:0}
.tab.o{background:#2A4AA6}
#boxlab{position:absolute;left:290px;top:-62px;width:260px;padding:8px 0;border-radius:6px;background:var(--paper);color:var(--dark);font:800 22px var(--ui);text-align:center;letter-spacing:.1em;opacity:0}
/* stempel */
#stT{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 42% 40%,#7A4A26,#4A2A12 70%)}
#stT:after{content:"";position:absolute;left:44px;top:44px;width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#C99A5C,#8A5E2E)}
#docs{position:absolute;left:0;top:0;width:1080px;height:1350px}
.doc{position:absolute;left:0;top:0;width:600px;height:690px;margin:-345px 0 0 -300px;border-radius:10px;background:#FFFDF6;overflow:hidden;
  box-shadow:12px 18px 0 rgba(70,38,12,.2),20px 34px 48px rgba(50,25,5,.38);transform-origin:50% 50%;opacity:0}
.doc .hd{height:108px;padding:0 32px;background:var(--c);color:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:14px;transform-origin:50% 100%}
.doc .hd b{font:800 46px/1 var(--head)}
.doc .hd i{font:800 18px var(--ui);font-style:normal;letter-spacing:.1em;padding:6px 12px;border-radius:6px;background:rgba(255,255,255,.2);flex:none}
.doc .bd{padding:22px 32px;color:var(--dark);font:700 26px/1.2 var(--ui)}
.doc .code{font:800 17px var(--ui);letter-spacing:.1em;color:#8A8F9A;margin-bottom:8px}
.doc .mut{color:#8A8F9A;font-weight:600}
.doc .rl{height:12px;border-radius:6px;background:#E3E0D6;margin:10px 0 4px}
.doc .rl.s{width:62%}
.sec{padding:12px 0 4px}
.sec .n{display:inline-block;width:36px;color:var(--ink);font-weight:900}
.gx{display:grid;font-size:22px;border:2px solid #D3D7CF;grid-template-columns:1fr 1.2fr 1.3fr}
.gx>div{padding:15px 12px;border-right:1px solid #E0E3DC;border-bottom:1px solid #E0E3DC;font-weight:700;white-space:nowrap;display:flex;align-items:center}
.gx .gh{background:#E6EFE8;color:#41584A;font-size:16px;letter-spacing:.06em;text-transform:uppercase;font-weight:800}
.gx .y{background:#FFF1B8}
.bar{flex:1;height:16px;border-radius:8px;background:#E3E6E0;overflow:hidden;margin-right:10px}
.bar i{display:block;height:100%;width:0;border-radius:8px;background:var(--xl)}
.bar.lo i{background:#E0A82E}
.rd{font-size:17px;color:#41584A;white-space:nowrap}
.stp{display:flex;gap:16px;align-items:center;padding:13px 10px;margin:0 -10px;border-bottom:1px solid #ECE8DD;font-size:25px;border-radius:8px}
.stp b{flex:none;width:38px;height:38px;border-radius:50%;background:var(--ink);color:var(--paper);font:800 21px/38px var(--ui);text-align:center}
.sig{display:flex;gap:40px;margin-top:22px}
.sig div{flex:1;font-size:18px;color:#8A8F9A;font-weight:700}
.sig div:after{content:"";display:block;height:2px;background:#C9C4B6;margin-top:56px}
#stI{position:absolute;right:34px;bottom:44px;width:250px;height:104px;border:6px solid var(--red);border-radius:12px;color:var(--red);font:800 34px/1 var(--head);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;letter-spacing:.04em;opacity:0;mix-blend-mode:multiply;transform:rotate(-9deg)}
#stI small{font:800 16px var(--ui);letter-spacing:.16em}

/* ---------- KERTAS MEMO (teks) ---------- */
#memo{position:absolute;left:60px;top:44px;width:960px;height:430px;background:var(--paper);border-radius:6px;transform:rotate(-.7deg);transform-origin:50% 0;
  box-shadow:8px 12px 0 rgba(70,38,12,.2),16px 26px 36px rgba(50,25,5,.32);opacity:0}
#memo:before{content:"";position:absolute;left:390px;top:-18px;width:180px;height:40px;background:rgba(240,228,196,.82);transform:rotate(2deg);box-shadow:0 2px 4px rgba(0,0,0,.08)}
.mt{position:absolute;left:44px;width:872px;color:var(--dark)}
.w{display:inline-block;opacity:0}
.em{background:linear-gradient(transparent 52%,var(--note) 52%,var(--note) 94%,transparent 94%) no-repeat;background-size:0% 100%;padding:0 4px;margin:0 -4px}
#m1e{top:34px;font:900 34px var(--ui);letter-spacing:.14em;color:var(--red)}
#m1h{top:86px;font:800 76px/1 var(--head);letter-spacing:-.01em}
#m2a{top:34px;font:700 50px/1.1 var(--ui);color:#3C4558}
#m2b{top:104px;font:800 60px/1.04 var(--head);letter-spacing:-.01em}
#m3a{top:30px;font:600 44px/1.12 var(--ui);color:#5A6274}
#m3b{top:148px;font:800 62px/1.04 var(--head);letter-spacing:-.01em}
.cap{position:absolute;left:44px;top:34px;width:872px;display:flex;gap:26px;align-items:center;opacity:0}
.cap b{flex:none;width:96px;height:96px;border-radius:50%;background:var(--ink);color:var(--paper);font:800 62px/96px var(--head);text-align:center}
.cap span{font:800 52px/1.04 var(--head);color:var(--dark);letter-spacing:-.01em}
#m7{top:20px;text-align:center;opacity:0}
#m7 b{display:inline-block;font:800 200px/1 var(--head);color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
#m7 span{display:inline-block;margin-left:20px;font:800 72px/1 var(--head);color:var(--dark);vertical-align:44px}
#m7s{top:240px;text-align:center;font:700 40px var(--ui);color:#3C4558;opacity:0}
#m7s b{color:var(--ink);font-weight:900}
#f1{top:34px;font:800 86px/1 var(--head);letter-spacing:-.015em}
#f2{top:228px;font:700 48px/1.1 var(--ui);color:#3C4558}

#cta{position:absolute;left:140px;top:1222px;width:800px;height:108px;border-radius:54px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;gap:24px;
  font:800 50px var(--head);white-space:nowrap;letter-spacing:.01em;opacity:0;box-shadow:0 10px 0 #142863,0 26px 40px rgba(50,25,5,.45)}
#cta svg{width:46px;height:46px;flex:none}

#snd{position:fixed;right:14px;bottom:14px;z-index:60;background:rgba(28,35,51,.92);color:#FBF6EA;border:2px solid #FFE27A;border-radius:24px;padding:10px 18px;font:700 15px var(--ui);cursor:pointer}
#snd.on{background:#FFE27A;color:#1C2333}
#ui{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:none;align-items:center;gap:12px;padding:9px 14px;border-radius:12px;background:rgba(14,16,22,.9);font:13px var(--ui);color:#A0A6B4;z-index:50}
#ui.on{display:flex} #ui button{background:#262A34;color:#fff;border:0;padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
#scrub{width:320px} #clock{font-variant-numeric:tabular-nums;min-width:5ch;text-align:right}
</style>
</head>
<body>
<div id="stage">
  <div id="scene">
    <div id="desk"></div>
    <div class="ob sh" id="pen"></div>
    <div class="ob sh" id="mug"></div>
    <div class="ob sh" id="nb"><div class="lab">CATATAN<br>PRIBADI</div><div class="band"></div><div id="lock"><i></i><b></b></div></div>
    <div class="ob sh np" id="np1">KETUA</div>
    <div class="ob sh np" id="np2">PENGGANTI</div>
    <div class="ob sh" id="box"><div id="boxlab">ARSIP YAYASAN</div><div id="sliv"></div></div>
    <div id="folds"></div>
    <div id="notes"></div>
    <div id="docs"></div>
    <div class="ob" id="stT" style="box-shadow:14px 24px 30px rgba(50,25,5,.4)"></div>
  </div>

  <div id="memo">
    <div class="mt" id="m1e">KETUA YAYASAN,</div>
    <div class="mt" id="m1h" data-t="Aturan yayasan|sudah tertulis,|atau masih Bapak|*ingat *sendiri?"></div>
    <div class="mt" id="m2a" data-t="Kalau Bapak berhenti besok,"></div>
    <div class="mt" id="m2b" data-t="pengganti Bapak harus|*menebak-nebak *aturannya."></div>
    <div class="mt" id="m3a" data-t="Supaya pengganti Bapak|tidak menebak-nebak,"></div>
    <div class="mt" id="m3b" data-t="ada *tiga *hal yang perlu|disiapkan dari sekarang."></div>
    <div id="caps"></div>
    <div class="mt" id="m7"><b id="bign">3</b><span>dokumen</span></div>
    <div class="mt" id="m7s">tata kelola yayasan · <b>14</b> kategori</div>
    <div class="mt" id="f1" data-t="Aturan yayasan|jadi *tersistem."></div>
    <div class="mt" id="f2" data-t="Tidak lagi hanya Bapak yang ingat."></div>
  </div>

  <div id="cta"><span>Dapatkan Sekarang</span>
    <svg viewBox="0 0 54 54" fill="none" stroke="#FBF6EA" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 27h36M30 11l16 16-16 16"/></svg></div>
</div>
<audio id="vo" src="audio/vo.mp3" preload="auto"></audio>
<button id="snd" aria-label="Putar dengan suara">&#9654;&#xFE0E; Dengan suara</button>
<div id="ui"><button id="btn-play">Pause</button><button id="btn-restart">Restart</button>
  <input type="range" id="scrub" min="0" max="1000" value="0"><span id="clock">0.00s</span></div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const Q=new URLSearchParams(location.search);
const W=1080,H=1350,DUR=44.7;
const tl=gsap.timeline({paused:true});
const FT=(tg,f,t,at)=>tl.fromTo(tg,f,Object.assign({immediateRender:false},t),at);

/* ===== WAKTU DARI AUDIO (audio/vo.mp3, Finn, 44,12 dtk; silencedetect + Whisper) =====
   "Ketua yayasan" 0,00-1,05 · "aturan yayasan sudah tertulis" 1,27-3,26 · "atau masih Bapak ingat sendiri?" 3,61-5,42
   "Kalau Bapak berhenti besok, pengganti Bapak harus menebak-nebak aturannya." 5,87-9,90
   "Supaya pengganti Bapak tidak menebak-nebak," 10,45-12,65 · "ada tiga hal yang perlu disiapkan dari sekarang." 12,85-15,53
   "Pertama," 16,03 · "semua yang selama ini Bapak ingat sendiri." 16,81-19,00 · "Tulis di memori jabatan." 19,34-20,61
   "Kedua," 21,01 · "siapa calon penerus Bapak dan seberapa siap." 21,76-24,64 · "Catat di peta suksesi." 24,92-26,16
   "Ketiga," 26,54 · "cara menyerahkan jabatan" 27,37-28,72 · "sampai berita acaranya." 28,90-30,30 · "Ikuti SOP serah terima jabatan." 30,54-32,98
   "Tiga dokumen ini bagian dari seratus tujuh puluh dua dokumen tata kelola yayasan." 33,39-38,27
   "Aturan yayasan jadi tersistem." 38,64-40,72 · "Tidak lagi hanya Bapak yang ingat." 41,00-42,76 · "Dapatkan sekarang." 43,07-43,93 */

/* ============ STATE ============ */
const S={cs:1,cy:0,mh:430,n:3};
const P=[0,1,2].map(()=>({en:0,fl:0}));

/* ============ BENDA DI MEJA ============ */
function place(e,x,y,w,h,r){ e.style.left=(x-w/2)+'px'; e.style.top=(y-h/2)+'px'; e.dataset.r=r; gsap.set(e,{rotation:r}); return e; }
place($('#np1'),540,600,400,100,0); place($('#np2'),540,600,400,100,0);
place($('#nb'),290,905,290,380,-8); place($('#mug'),880,720,170,170,0); place($('#pen'),905,1262,300,22,-18);
place($('#box'),540,1000,840,340,0); place($('#stT'),690,1040,150,150,0);
const rot=e=>+e.dataset.r;
const drop=(e,at,o={})=>FT(e,{opacity:0,y:-80,scale:1.16,rotation:rot(e)+(o.dr??9)},{opacity:1,y:0,scale:1,rotation:rot(e),duration:o.d??.55,ease:'power3.out'},at);
const lift=(e,at,o={})=>FT(e,{opacity:1,y:0,x:0,scale:1,rotation:rot(e)},{opacity:1,y:o.y??-1000,x:o.x??0,scale:1.12,rotation:rot(e)+(o.dr??14),duration:o.d??.8,ease:'power2.in'},at);

/* catatan tempel: tebakan pengganti */
const NOTES=[[250,770,-7,'Aturannya<br>apa?'],[850,775,6,'Harus izin<br>siapa?'],[560,905,-3,'Dulu<br>gimana?'],[270,1090,5,'Tanya<br>siapa?'],[820,1075,-6,'Ini<br>boleh?']];
const NOTEL=NOTES.map(([x,y,r,t])=>{ const e=document.createElement('div'); e.className='ob note'; e.innerHTML=t; $('#notes').appendChild(e); return place(e,x,y,250,200,r); });

/* map bernomor */
const FX=[230,540,850], FY=1010, FROT=[-4,2,4];
const NAMES=['Memori<br>Jabatan','Peta<br>Suksesi','Serah Terima<br>Jabatan'];
const FOLD=FX.map((x,i)=>{ const e=document.createElement('div'); e.className='ob sh fold';
  e.innerHTML=`<div class="num">${i+1}</div><svg class="ck" viewBox="0 0 70 70"><path d="M12 37l15 15 31-34"/></svg><div class="ln" style="top:150px"></div><div class="ln" style="top:172px;right:90px"></div><div class="nm">${NAMES[i]}</div>`;
  $('#folds').appendChild(e); return place(e,x,FY,260,330,FROT[i]); });

/* ============ DOKUMEN (isi = contoh tampilan) ============ */
const DOCS=[
 {cap:'Yang selama ini|Bapak ingat sendiri',c:'#1F3A8A',tag:'WORD',title:'Memori Jabatan',body:`
  <div class="code">YYS-PG-012</div>
  <div class="sec"><span class="n">1</span>Gambaran umum jabatan</div><div class="rl"></div><div class="rl s"></div>
  <div class="sec"><span class="n">2</span>Pekerjaan yang sudah selesai</div><div class="rl"></div>
  <div class="sec"><span class="n">3</span>Pekerjaan yang belum selesai</div><div class="rl"></div><div class="rl s"></div>
  <div class="sec"><span class="n">4</span>Permasalahan dan saran</div><div class="rl s"></div>`},
 {cap:'Calon penerus,|dan seberapa siap',c:'#1E7A4C',tag:'EXCEL',title:'Peta Suksesi',body:`
  <div class="code">EXCL-KS-010</div>
  <div class="gx">
   <div class="gh">Jabatan</div><div class="gh">Calon penerus</div><div class="gh">Kesiapan</div>
   <div>Ketua</div><div>Siti Rahma</div><div><span class="bar"><i data-w="70"></i></span><span class="rd">1–2 th</span></div>
   <div>Sekretaris</div><div>Ahmad Yusuf</div><div><span class="bar"><i data-w="100"></i></span><span class="rd">siap</span></div>
   <div>Bendahara</div><div>Dewi Lestari</div><div><span class="bar lo"><i data-w="35"></i></span><span class="rd">3 th</span></div>
   <div>Pengawas</div><div class="y">belum ada</div><div class="y"><span class="bar lo"><i data-w="0"></i></span><span class="rd">–</span></div></div>
  <div class="mut" style="margin-top:16px;font-size:19px">Contoh pengisian.</div>`},
 {cap:'Cara menyerahkan jabatan,|sampai berita acaranya',c:'#1F3A8A',tag:'SOP',title:'Serah Terima Jabatan',body:`
  <div class="code">YYS-PG-011</div>

  <div class="sig"><div>Yang menyerahkan</div><div>Yang menerima</div></div>

];
const DOCEL=[], CAPEL=[];
DOCS.forEach((d,i)=>{
  const e=document.createElement('div'); e.className='doc'; e.style.setProperty('--c',d.c);
  e.innerHTML=`<div class="hd"><b>${d.title}</b><i>${d.tag}</i></div><div class="bd">${d.body}</div>`; $('#docs').appendChild(e); DOCEL.push(e);
  const c=document.createElement('div'); c.className='cap'; c.innerHTML=`<b>${i+1}</b><span>${d.cap.replace('|','<br>')}</span>`; $('#caps').appendChild(c); CAPEL.push(c);
});

/* kotak arsip: 172 lembar + tab A-N (jumlah per kategori dari halaman jualan) */
const GRP=[10,12,15,10,10,16,12,13,15,15,12,12,10,10];
const SV=[]; const sliv=$('#sliv'); let k=0;
GRP.forEach((g,gi)=>{ const x0=k*4.5;
  const t=document.createElement('div'); t.className='tab'+(gi%2?' o':''); t.textContent='ABCDEFGHIJKLMN'[gi]; t.style.left=Math.min(x0+g*2.25-22,730)+'px'; sliv.appendChild(t);
  for(let j=0;j<g;j++,k++){ const e=document.createElement('div'); e.className='sv'+((k%3===0)?' b':''); e.style.left=(k*4.5)+'px'; e.style.height=(212+((k*37)%34))+'px'; sliv.appendChild(e); SV.push(e); } });
const TABS=$$('.tab',sliv);

/* teks per kata */
function words(e){ e.innerHTML=e.dataset.t.split('|').map(l=>l.trim().split(/\s+/).map(w=>{ const em=w[0]==='*'; return `<span class="w${em?' em':''}">${em?w.slice(1):w}</span>`; }).join(' ')).join('<br>'); return $$('.w',e); }
const WM1=words($('#m1h')), W2a=words($('#m2a')), W2b=words($('#m2b')), W3a=words($('#m3a')), W3b=words($('#m3b')), WF1=words($('#f1')), WF2=words($('#f2'));
const wordsIn=(ws,at,o={})=>FT(ws,{opacity:0,y:o.y??30},{opacity:1,y:0,duration:o.dur??.45,ease:o.ease??'back.out(1.6)',stagger:o.st??.08},at);
const mark=(sel,at,d=.45)=>FT($$('.em',$(sel)),{backgroundSize:'0% 100%'},{backgroundSize:'100% 100%',duration:d,ease:'power2.out',stagger:.12},at);
const fadeOut=(sel,at,d=.25)=>FT(sel,{opacity:1},{opacity:0,duration:d,ease:'power1.in'},at);
const memoTo=(h,at)=>{ FT(S,{mh:S._mh??430},{mh:h,duration:.4,ease:'power2.inOut'},at); S._mh=h; };

/* ============ ADEGAN 1 (0-5,6): MEJA KETUA ============ */
FT('#memo',{opacity:0,y:-60,rotation:-4},{opacity:1,y:0,rotation:-.7,duration:.5,ease:'power3.out'},0);

wordsIn(WM1.slice(4),3.61,{st:.36,ease:'back.out(1.9)'});
mark('#m1h',4.75);
FT('#lock',{rotation:0},{rotation:14,duration:.12,ease:'sine.inOut',yoyo:true,repeat:5},4.55);   /* "ingat sendiri" */
FT(S,{cs:1},{cs:1.035,duration:5.2,ease:'sine.inOut'},.2);

/* ============ ADEGAN 2 (5,6-10,1): KETUA PERGI, PENGGANTI MENEBAK ============ */
fadeOut(['#m1e','#m1h'],5.5); memoTo(300,5.55);
FT(S,{cs:1.035},{cs:1,duration:.6,ease:'power2.inOut'},5.6);
wordsIn(W2a,5.87,{st:.24});
lift($('#np1'),6.35,{dr:-10}); lift($('#nb'),6.5,{x:-120,dr:-18});                   /* "berhenti besok" */
wordsIn(W2b,7.35,{st:.3});
drop($('#np2'),7.5);                                                                    /* "pengganti Bapak" */
mark('#m2b',8.5);
NOTEL.forEach((e,i)=>drop(e,8.3+.26*i,{d:.42,dr:i%2?-12:12}));                       /* "menebak-nebak" */

/* ============ ADEGAN 3 (10,1-15,6): TIGA HAL ============ */
fadeOut(['#m2a','#m2b'],10.05); memoTo(312,10.1);
wordsIn(W3a,10.45,{st:.3,y:22});
NOTEL.forEach((e,i)=>FT(e,{x:0,rotation:rot(e),opacity:1},{x:-1300,rotation:rot(e)-30,opacity:1,duration:.5,ease:'power2.in'},11.45+.07*i));   /* "tidak menebak-nebak" */
wordsIn(W3b,12.85,{st:.3});
mark('#m3b',13.4);
FOLD.forEach((e,i)=>drop(e,13.35+.32*i,{dr:i%2?-10:10}));
FT(S,{cs:1},{cs:1.04,duration:1.7,ease:'sine.inOut'},13.9);
fadeOut(['#m3a','#m3b'],15.55); memoTo(196,15.6);
FT(S,{cs:1.04},{cs:1,duration:.5,ease:'power2.inOut'},15.6);

/* ============ ADEGAN 4-6 (16-33): TIAP MAP DIBUKA ============ */
const ENTER=[16.7,21.62,27.22], FLY=[20.5,26.0,32.62], CAPIN=[16.0,21.0,26.52];
DOCS.forEach((d,k)=>{
  FT(CAPEL[k],{opacity:0,x:-30},{opacity:1,x:0,duration:.35,ease:'power2.out'},CAPIN[k]);
  FT(CAPEL[k],{opacity:1},{opacity:0,duration:.2},FLY[k]+.1);
  FT(FOLD[k],{scale:1},{scale:1.06,duration:.25,ease:'power2.out',yoyo:true,repeat:1},ENTER[k]-.3);
  FT(P[k],{en:0},{en:1,duration:.6,ease:'back.out(1.2)'},ENTER[k]);
  FT(P[k],{fl:0},{fl:1,duration:.45,ease:'power3.in'},FLY[k]);
  FT($('.nm',FOLD[k]),{opacity:0,y:10},{opacity:1,y:0,duration:.3},FLY[k]+.4);
  FT($('.ck',FOLD[k]),{opacity:0,scale:.3},{opacity:1,scale:1,duration:.4,ease:'back.out(2.6)'},FLY[k]+.45);
  FT($('.num',FOLD[k]),{opacity:1},{opacity:.35,duration:.3},FLY[k]+.4);
});
const HD=DOCEL.map(e=>e.querySelector('.hd'));
FT(HD[0],{scale:1},{scale:1.05,duration:.3,ease:'sine.inOut',yoyo:true,repeat:1},19.45);          /* "Tulis di memori jabatan" */
FT($$('.bar i',DOCEL[1]),{width:'0%'},{width:(i,e)=>e.dataset.w+'%',duration:.6,ease:'power2.out',stagger:.15},23.35);   /* "seberapa siap" */
FT(HD[1],{scale:1},{scale:1.05,duration:.3,ease:'sine.inOut',yoyo:true,repeat:1},25.0);           /* "Catat di peta suksesi" */
FT('#bast',{backgroundColor:'rgba(255,226,122,0)'},{backgroundColor:'rgba(255,226,122,1)',duration:.35,ease:'power2.out'},29.25);   /* "berita acaranya" */
/* momen istimewa: stempel mendarat ("serah terima jabatan") */
FT('#stT',{opacity:0,y:-420,scale:1.35},{opacity:1,y:0,scale:1,duration:.32,ease:'power3.in'},30.95);
FT('#stI',{opacity:0,scale:1.25},{opacity:.92,scale:1,duration:.12,ease:'power2.out'},31.27);

/* ============ ADEGAN 7 (33,4-38,3): 3 DARI 172 ============ */
memoTo(318,33.3);
FT('#m7',{opacity:0,y:24,scale:.92},{opacity:1,y:0,scale:1,duration:.45,ease:'back.out(1.7)'},33.42);   /* "Tiga dokumen ini" */
FOLD.forEach((e,i)=>FT(e,{x:0,y:0,rotation:FROT[i]},{x:540-FX[i]+(i-1)*16,y:-10+i*8,rotation:FROT[i]*1.6,duration:.55,ease:'power3.inOut'},33.5+.08*i));

FT('#m7s',{opacity:0,y:20},{opacity:1,y:0,duration:.45,ease:'back.out(1.5)'},37.0);                /* "tata kelola yayasan" */

/* ============ ADEGAN 8 (38,3-42,9): PENUTUP ============ */
fadeOut(['#m7','#m7s'],38.3); memoTo(316,38.35);
wordsIn(WF1,38.64,{st:.42,y:28});

FT('#cta',{scale:1},{scale:1.03,duration:.45,ease:'sine.inOut',repeat:1,yoyo:true},43.85);
tl.to({},{duration:.01},DUR);

/* ============ RENDER ============ */
const scene=$('#scene'), memo=$('#memo'), bn=$('#bign');
const SHK=[[7.95,3],[31.3,13],[34.75,6]];
let lastN=-1;
const READ={x:540,y:770}, DROT=[-3,2,-2];
const lerp=(a,b,u)=>a+(b-a)*u;
function render(t){
  let sh=0; SHK.forEach(([t0,A])=>{ const u=t-t0; if(u>0&&u<1.2) sh+=A*Math.exp(-5*u)*Math.sin(34*u); });
  const dx=3*Math.sin(t*.42), dy=3*Math.sin(t*.57)+sh;
  scene.style.transform=`translate(${dx.toFixed(2)}px,${dy.toFixed(2)}px) scale(${S.cs.toFixed(4)})`;
  memo.style.height=S.mh.toFixed(1)+'px';
  P.forEach((p,i)=>{
    const u=p.en*(1-p.fl), d=DOCEL[i];
    const cx=lerp(FX[i],READ.x,u), cy=lerp(FY,READ.y+5*Math.sin(t*1.2+i),u), s=lerp(.3,1,u), r=lerp(FROT[i],DROT[i],u);
    d.style.transform=`translate(${(cx).toFixed(1)}px,${cy.toFixed(1)}px) rotate(${r.toFixed(2)}deg) scale(${s.toFixed(4)})`;
    d.style.opacity=Math.min(1,u*4).toFixed(3); d.style.visibility=u>0.002?'visible':'hidden';
  });
  const n=Math.round(S.n);
  if(n!==lastN){ bn.textContent=n; for(let j=0;j<172;j++)SV[j].style.opacity=j<n?1:0; lastN=n; }
}

/* ============ PEREKAT ============ */
const stage=$('#stage');
const fit=()=>{ const sc=Math.min(innerWidth/W,innerHeight/H); stage.style.transform=`translate(-50%,-50%) scale(${sc})`; };
addEventListener('resize',fit); fit();
const clock=$('#clock'),scrub=$('#scrub'),btn=$('#btn-play'); let scrubbing=false;
(function frame(){ const t=tl.time(); render(t); clock.textContent=t.toFixed(2)+'s'; if(!scrubbing)scrub.value=String(t/DUR*1000); requestAnimationFrame(frame); })();
const toggle=()=>{ if(tl.paused()||tl.progress()>=1){ if(tl.progress()>=1)tl.progress(0); tl.play(); btn.textContent='Pause'; } else { tl.pause(); btn.textContent='Play'; } };
btn.onclick=toggle; $('#btn-restart').onclick=()=>{ tl.pause(0); tl.play(); btn.textContent='Pause'; };
scrub.addEventListener('pointerdown',()=>{scrubbing=true;tl.pause();btn.textContent='Play';});
addEventListener('pointerup',()=>scrubbing=false);
scrub.addEventListener('input',()=>{tl.pause();tl.time(scrub.value/1000*DUR);});
addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();toggle();} if(/^[rR]$/.test(e.key)){tl.pause(0);tl.play();} if(/^[hH]$/.test(e.key))$('#ui').classList.toggle('on'); });
if(Q.has('debug'))$('#ui').classList.add('on');
const vo=$('#vo'), snd=$('#snd'); let soundOn=false;
if(Q.has('clean')) snd.style.display='none';
const setSound=on=>{ soundOn=on; snd.classList.toggle('on',on); snd.innerHTML=on?'&#9632;&#xFE0E; Suara menyala':'&#9654;&#xFE0E; Dengan suara';
  if(on){ vo.currentTime=Math.min(tl.time(),vo.duration||DUR); const p=vo.play(); if(p&&p.catch)p.catch(()=>setSound(false)); } else vo.pause(); };
snd.onclick=()=>{ if(!soundOn){ if(tl.paused()||tl.progress()>=1){ tl.pause(0); tl.play(); btn.textContent='Pause'; } } setSound(!soundOn); };
(function sync(){ if(soundOn&&!tl.paused()&&Math.abs(vo.currentTime-tl.time())>.1) vo.currentTime=tl.time(); requestAnimationFrame(sync); })();
tl.eventCallback('onComplete',()=>{ tl.play(0); if(soundOn){ vo.currentTime=0; vo.play().catch(()=>{}); } });
const seek=t=>{ tl.pause(); tl.time(t,false); if(gsap.ticker.tick)gsap.ticker.tick(); render(t); };
window.OPENER={W,H,DURATION:DUR,tl,seek,ready:false};
Promise.all(['800 80px "Bricolage Grotesque"','700 40px "Nunito Sans"','900 30px "Nunito Sans"','700 40px "Caveat"'].map(f=>document.fonts.load(f)))
  .then(()=>document.fonts.ready).then(()=>{ window.OPENER.ready=true; if(!Q.has('clean'))tl.play(0); });
</script>
