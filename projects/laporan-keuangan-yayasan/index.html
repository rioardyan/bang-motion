<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Neraca Jadi Timbangan</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  PROMO META ADS 4:5 (1080x1350), 33,9 detik, mengikuti audio/vo.mp3 (ElevenLabs, suara Prayan), loop.
  Konsep A: neraca jadi timbangan sungguhan. Lima lembar komponen jadi beban, baris "Selisih (harus nol)" membuat timbangan rata.
  Gaya: kertas buku besar (ledger), kartu memo, timbangan kuningan. Naskah: naskah.md · VO: vo-script.md · Style brief: style-brief.md
  ?debug=1 = panel scrub · ?clean=1 = tanpa autoplay (potret/export).
  Angka di Excel = data contoh.
-->
<link rel="stylesheet" href="fonts/fonts.css">
<script src="vendor/gsap.min.js"></script>
<style>
:root{
  --paper:#F3F1E6; --rule:#D3E4D6; --ink:#1F2A2E; --teal:#0E7C86; --teal2:#0A4A52; --brass:#E3B23C; --brass2:#B88A22; --red:#C8463D; --memo:#FFFDF5;
  --sg:'Space Grotesk',system-ui,sans-serif; --mono:'DM Mono',ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:var(--sg)}
#stage{position:fixed;left:50%;top:50%;width:1080px;height:1350px;transform:translate(-50%,-50%) scale(1);overflow:hidden;
  background:
    linear-gradient(90deg,transparent 92px,rgba(214,120,112,.55) 92px 95px,transparent 95px 100px,rgba(214,120,112,.55) 100px 103px,transparent 103px),
    repeating-linear-gradient(90deg,transparent 0 118px,var(--rule) 118px 120px),
    repeating-linear-gradient(180deg,transparent 0 44px,#E3E8DC 44px 46px),
    var(--paper)}
#scale{position:absolute;left:0;top:0;width:1080px;height:1350px}
#scale svg{position:absolute;left:0;top:0;width:1080px;height:1350px;overflow:visible}
#night{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 540px 780px,rgba(11,31,36,.08) 0,rgba(11,31,36,.18) 260px,rgba(11,31,36,.86) 720px)}
#sweep{position:absolute;left:0;top:0;width:320px;height:1350px;background:linear-gradient(100deg,transparent,rgba(255,250,225,.5) 50%,transparent);transform:translateX(-420px) skewX(-14deg);opacity:0;pointer-events:none}

/* ---------- LAYAR ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
.w{display:inline-block;opacity:0}
.memo{position:absolute;left:56px;top:56px;width:968px;padding:28px 36px 32px;background:var(--memo);border-radius:6px;color:var(--ink);
  box-shadow:0 10px 0 rgba(31,42,46,.10),0 22px 34px rgba(0,0,0,.20);opacity:0}
.memo:before{content:"";position:absolute;left:50%;top:-14px;width:120px;height:28px;margin-left:-60px;background:rgba(227,178,60,.55);transform:rotate(-2deg)}
.memo .ln{display:block}
.red{color:var(--red)} .tl{color:var(--teal)}
#m1 .who{font:700 30px var(--sg);letter-spacing:.06em;color:var(--teal);margin-bottom:14px}
#m1 .q{font:700 66px/1.06 var(--sg);letter-spacing:-.02em}
#m2 .a{font:700 62px/1.06 var(--sg);letter-spacing:-.02em}
#m2 .b{font:600 46px/1.12 var(--sg);margin-top:18px}
#m3 .k{font:700 40px var(--sg);color:var(--teal)}
#m3 .a{font:700 60px/1.06 var(--sg);letter-spacing:-.02em;margin-top:8px}
#m3 .b{font:600 44px/1.12 var(--sg);margin-top:14px}
#cap{position:absolute;left:56px;top:30px;width:968px;padding:16px 30px;background:var(--memo);border-radius:6px;box-shadow:0 8px 0 rgba(31,42,46,.10),0 16px 26px rgba(0,0,0,.16);opacity:0;min-height:84px}
#cap .c{position:absolute;left:30px;right:30px;top:18px;font:700 39px/1.1 var(--sg);color:var(--ink);opacity:0}
#xl{position:absolute;left:150px;top:178px;width:780px;border-radius:12px;background:#FFFEF8;overflow:hidden;opacity:0;box-shadow:0 14px 0 rgba(31,42,46,.10),0 26px 40px rgba(0,0,0,.22)}
#xl .hd{height:66px;padding:0 24px;background:var(--brass);color:var(--ink);display:flex;align-items:center;justify-content:space-between;font:700 28px var(--sg)}
#xl .hd i{font:500 18px var(--mono);font-style:normal;padding:4px 10px;border-radius:6px;background:rgba(0,0,0,.14)}
#xl .rw{display:grid;grid-template-columns:1fr 290px;align-items:center;height:60px;padding:0 24px;border-bottom:2px solid #E7EBE8;font:600 26px var(--sg);color:var(--ink)}
#xl .rw b{font:500 30px var(--mono);text-align:right;font-weight:500}
#xl .rw.sel{background:rgba(0,0,0,0)}
#xl .ft{padding:5px 24px;font:500 15px var(--mono);color:#8A9795}
#m6{height:126px;overflow:hidden}
#m6 .pt{display:inline-block;padding:12px 26px;border-radius:10px;background:var(--teal2);color:var(--memo);font:700 36px var(--sg)}
#m6 .pt i{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--brass);margin-right:12px;vertical-align:1px}
#m6 .big{display:flex;align-items:baseline;gap:20px;margin-top:8px;opacity:0}
#m6 .big b{font:500 150px/1 var(--mono);color:var(--teal);letter-spacing:-.04em}
#m6 .big span{font:700 52px var(--sg)}
#m6 .kt{font:700 36px var(--sg);margin-top:4px;opacity:0}
#m7 .a{font:700 72px/1.06 var(--sg);letter-spacing:-.02em}
#clock{position:absolute;left:64px;top:1150px;display:flex;align-items:center;gap:14px;padding:10px 20px;border-radius:12px;background:rgba(11,31,36,.82);color:#FFE9A8;font:500 46px var(--mono);opacity:0}
#clock svg{width:34px;height:34px}
#cta{position:absolute;left:150px;top:1212px;width:780px;height:104px;border-radius:52px;background:var(--teal);color:var(--memo);display:flex;align-items:center;justify-content:center;gap:22px;
  font:700 48px var(--sg);opacity:0;box-shadow:0 10px 0 var(--teal2),0 24px 36px rgba(0,0,0,.25)}
#cta i{width:64px;height:64px;border-radius:50%;background:var(--brass);display:flex;align-items:center;justify-content:center;flex:none}
#cta svg{width:36px;height:36px}
#snd{position:fixed;right:14px;bottom:14px;z-index:60;background:rgba(31,42,46,.92);color:#FFFDF5;border:2px solid #E3B23C;border-radius:24px;padding:10px 18px;font:600 15px var(--sg);cursor:pointer}
#snd.on{background:#E3B23C;color:#1F2A2E}
#ui{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:none;align-items:center;gap:12px;padding:9px 14px;border-radius:12px;background:rgba(14,16,22,.9);font:13px var(--sg);color:#A0A6B4;z-index:50}
#ui.on{display:flex} #ui button{background:#262A34;color:#fff;border:0;padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
#scrub{width:320px} #clock2{font-variant-numeric:tabular-nums;min-width:5ch;text-align:right}
</style>
</head>
<body>
<div id="stage">
  <div id="scale"><svg viewBox="0 0 1080 1350" id="ssvg"></svg></div>
  <div id="night"></div>
  <div id="sweep"></div>
  <div id="hud">
    <div class="memo" id="m1"><div class="who" id="who" data-t="PENGURUS & BENDAHARA YAYASAN,"></div>
      <div class="q" id="q1" data-t="Siapa yang mau tutup buku|tanpa begadang|mencari *selisih?"></div></div>
    <div class="memo" id="m2"><div class="a" id="a2" data-t="Neraca harusnya seimbang."></div><div class="b" id="b2" data-t="Tapi tiap tutup buku,|selalu ada *selisih."></div></div>
    <div class="memo" id="m3"><div class="k" id="k3" data-t="Caranya:"></div><div class="a" id="a3" data-t="LIMA komponen|laporan keuangan,"></div><div class="b" id="b3" data-t="disiapkan di Excel berformula."></div></div>
    <div id="cap"><div class="c" id="c4" data-t="Dan satu baris menjaga semuanya:"></div><div class="c" id="c5" data-t="Belum nol? Bapak langsung tahu,|sebelum laporan dikirim."></div></div>
    <div id="xl"><div class="hd">Laporan Keuangan<i>EXCEL</i></div>
      <div class="rw"><span>Total aset</span><b>4.820.000.000</b></div>
      <div class="rw"><span>Total liabilitas + aset neto</span><b id="xr2">4.820.000.000</b></div>
      <div class="rw sel" id="xsel"><span>Selisih (harus nol)</span><b id="xr3">0</b></div>
      <div class="ft">data contoh</div></div>
    <div class="memo" id="m6"><span class="pt"><i></i>Sistem Tata Kelola Yayasan</span>
      <div class="big"><b id="bign">0</b><span>dokumen</span></div><div class="kt"><span class="tl">14</span> kategori</div></div>
    <div class="memo" id="m7"><div class="a" id="a7" data-t="Neraca seimbang,|Bapak *tidur *tenang."></div></div>
    <div id="clock"><svg viewBox="0 0 34 34" fill="#FFE9A8"><path d="M22 3a14 14 0 1 0 9 22A12 12 0 0 1 22 3z"/></svg><span id="clk">23.47</span></div>
    <div id="cta"><span>Dapatkan Sekarang</span><i><svg viewBox="0 0 36 36" fill="none" stroke="#1F2A2E" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 18h24M20 8l10 10-10 10"/></svg></i></div>
  </div>
</div>
<audio id="vo" src="audio/vo.mp3" preload="auto"></audio>
<button id="snd" aria-label="Putar dengan suara">&#9654;&#xFE0E; Dengan suara</button>
<div id="ui"><button id="btn-play">Pause</button><button id="btn-restart">Restart</button>
  <input type="range" id="scrub" min="0" max="1000" value="0"><span id="clock2">0.00s</span></div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const Q=new URLSearchParams(location.search);
const W=1080,H=1350,DUR=33.9;
const tl=gsap.timeline({paused:true});
const FT=(tg,f,t,at)=>tl.fromTo(tg,f,Object.assign({immediateRender:false},t),at);
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){ const e=document.createElementNS(NS,tag); for(const k in attrs)e.setAttribute(k,attrs[k]); if(parent)parent.appendChild(e); return e; }

/* ============ STATE (fungsi murni dari t) ============ */
const S={th:0,sw:0,sel:0,scr:0,nt:1,clk:0,cnt:0,ok:0};
const CD=[0,1,2,3,4].map(()=>({f:0}));      /* lembar komponen jatuh 0..1 */
const PX=540, PY=640, ARM=320, CHAIN=230;

/* ============ TIMBANGAN ============ */
const sv=$('#ssvg');
const shadow=el('ellipse',{cx:540,cy:1112,rx:200,ry:16,fill:'rgba(31,42,46,.18)'},sv);
/* piringan jarum */
const dial=el('g',{},sv);
el('path',{d:`M${PX-150} ${PY} A150 150 0 0 1 ${PX+150} ${PY}Z`,fill:'#FFFDF5',stroke:'#1F2A2E','stroke-width':4},dial);
for(let a=-40;a<=40;a+=10){ const r=a*Math.PI/180, L=a===0?26:14; el('line',{x1:PX+Math.sin(r)*138,y1:PY-Math.cos(r)*138,x2:PX+Math.sin(r)*(138-L),y2:PY-Math.cos(r)*(138-L),stroke:a===0?'#0E7C86':'#1F2A2E','stroke-width':a===0?6:3},dial); }
const z=el('text',{x:PX,y:PY-92,'text-anchor':'middle','font-family':'DM Mono','font-size':34,fill:'#0E7C86'},dial); z.textContent='0';
const mi=el('text',{x:PX-104,y:PY-36,'text-anchor':'middle','font-family':'DM Mono','font-size':28,fill:'#C8463D'},dial); mi.textContent='−';
const pl=el('text',{x:PX+104,y:PY-36,'text-anchor':'middle','font-family':'DM Mono','font-size':28,fill:'#C8463D'},dial); pl.textContent='+';
/* tiang + alas */
el('rect',{x:PX-14,y:PY,width:28,height:440,fill:'#B88A22'},sv); el('rect',{x:PX-14,y:PY,width:9,height:440,fill:'#E3B23C'},sv);
el('path',{d:`M${PX-120} 1112 L${PX-80} 1076 L${PX+80} 1076 L${PX+120} 1112Z`,fill:'#B88A22',stroke:'#1F2A2E','stroke-width':4},sv);
/* papan angka selisih */
const plate=el('g',{},sv);
el('rect',{x:PX-126,y:760,width:252,height:84,rx:10,fill:'#1F2A2E'},plate);
const pl1=el('text',{x:PX,y:788,'text-anchor':'middle','font-family':'Space Grotesk','font-weight':700,'font-size':17,'letter-spacing':2,fill:'#FFFDF5'},plate); pl1.textContent='SELISIH';
const rd=el('text',{x:PX,y:828,'text-anchor':'middle','font-family':'DM Mono','font-size':30,fill:'#7FD3DA'},plate); rd.textContent='Rp 0';
/* rantai + piring */
const chains=[0,1,2,3].map(()=>el('line',{stroke:'#1F2A2E','stroke-width':3},sv));
function pan(label){ const g=el('g',{},sv);
  el('path',{d:'M-140 0 Q0 74 140 0Z',fill:'#E3B23C',stroke:'#1F2A2E','stroke-width':4},g);
  el('line',{x1:-140,y1:0,x2:140,y2:0,stroke:'#1F2A2E','stroke-width':5,'stroke-linecap':'round'},g);
  el('rect',{x:-126,y:48,width:252,height:42,rx:6,fill:'#FFFDF5',stroke:'#1F2A2E','stroke-width':2},g);
  const t=el('text',{x:0,y:75,'text-anchor':'middle','font-family':'Space Grotesk','font-weight':700,'font-size':label.length>10?17:21,'letter-spacing':.5,fill:'#1F2A2E'},g); t.textContent=label; return g; }
const panL=pan('ASET'), panR=pan('LIABILITAS + ASET NETO');
/* lengan + jarum (berputar) */
const beam=el('g',{},sv);
el('rect',{x:PX-ARM-8,y:PY-9,width:2*ARM+16,height:18,rx:9,fill:'#E3B23C',stroke:'#1F2A2E','stroke-width':4},beam);
const needle=el('g',{},sv);
el('path',{d:`M${PX-5} ${PY} L${PX} ${PY-128} L${PX+5} ${PY}Z`,fill:'#C8463D',stroke:'#1F2A2E','stroke-width':2},needle);
el('circle',{cx:PX,cy:PY,r:18,fill:'#E3B23C',stroke:'#1F2A2E','stroke-width':4},sv);
/* lima lembar komponen */
const DOCK=[[-62,'L'],[-34,'R'],[0,'L'],[34,'R'],[62,'L']];
const CARDS=DOCK.map((d,k)=>{ const g=el('g',{},sv);
  el('rect',{x:-34,y:-44,width:68,height:84,rx:5,fill:'#FFFDF5',stroke:'#1F2A2E','stroke-width':3},g);
  [-24,-12,0].forEach(y=>el('rect',{x:-22,y:y,width:44,height:5,rx:2,fill:'#CFD8D4'},g));
  el('circle',{cx:0,cy:22,r:14,fill:'#0E7C86'},g); const n=el('text',{x:0,y:29,'text-anchor':'middle','font-family':'DM Mono','font-size':20,fill:'#FFFDF5'},g); n.textContent=String(k+1);
  return g; });

/* ============ TEKS ============ */
function words(e){ e.innerHTML=e.dataset.t.split('|').map(l=>l.trim().split(/\s+/).map(w=>{ const em=w[0]==='*'; return `<span class="w${em?' em':''}">${em?w.slice(1):w}</span>`; }).join(' ')).join('<br>'); return $$('.w',e); }
const WHO=words($('#who')), Q1=words($('#q1')), A2=words($('#a2')), B2=words($('#b2')), K3=words($('#k3')), A3=words($('#a3')), B3=words($('#b3')), C4=words($('#c4')), C5=words($('#c5')), A7=words($('#a7'));
$$('#q1 .em,#b2 .em').forEach(e=>e.classList.add('red')); $$('#a7 .em').forEach(e=>e.classList.add('tl'));
const wordsIn=(ws,at,o={})=>FT(ws,{opacity:0,y:o.y??26},{opacity:1,y:0,duration:o.dur??.45,ease:o.ease??'back.out(1.6)',stagger:o.st??.08},at);
const memoIn=(sel,at)=>FT(sel,{opacity:0,y:-30,rotation:-3},{opacity:1,y:0,rotation:-.8,duration:.45,ease:'back.out(1.6)'},at);
const memoOut=(sel,at)=>FT(sel,{opacity:1,y:0},{opacity:0,y:-24,duration:.3,ease:'power2.in'},at);

/* ===== WAKTU DARI AUDIO (audio/vo.mp3, Prayan; silencedetect + Whisper) =====
   "Pengurus dan bendahara yayasan…" 0,00-1,61 · "siapa yang mau tutup buku tanpa begadang mencari selisih?" 2,04-4,80
   "Neraca harusnya seimbang." 5,40-6,92 · "Tapi tiap tutup buku," 7,42-8,68 · "selalu ada selisih." 8,87-9,98
   "Caranya:" 10,65-11,28 · "LIMA komponen laporan keuangan, disiapkan di Excel berformula." 11,59-15,20
   "Dan satu baris menjaga semuanya —" 15,84-17,89 · "selisih," 18,20-18,73 · "harus NOL." 19,06-19,61
   "Belum nol?" 20,27-20,83 · "Bapak langsung tahu…" 21,21-22,22 · "sebelum laporan dikirim." 22,39-23,59
   "Semua ini bagian dari Sistem Tata Kelola Yayasan —" 24,19-27,06 · "seratus tujuh puluh dua dokumen." 27,35-28,93
   "Neraca seimbang," 29,60-30,62 · "Bapak tidur tenang." 30,87-31,98 · "Dapatkan sekarang." 32,40-33,15 */

/* ============ ADEGAN 1 (0-5,2): HOOK ============ */
FT('#scale',{opacity:0,y:60},{opacity:1,y:0,duration:.7,ease:'power3.out'},0);
memoIn('#m1',.0); wordsIn(WHO,.1,{st:.12}); wordsIn(Q1,2.04,{st:.27,dur:.5});
FT('#clock',{opacity:0,x:-30},{opacity:1,x:0,duration:.4,ease:'power2.out'},.6);
memoOut('#m1',5.1);

/* ============ ADEGAN 2 (5,3-10,4): MASALAH ============ */
memoIn('#m2',5.3); wordsIn(A2,5.42,{st:.2,dur:.5});
wordsIn(B2,7.45,{st:.2,dur:.45});
FT(S,{th:0},{th:9,duration:1.6,ease:'elastic.out(1,0.35)'},7.45);                    /* "Tapi": timbangan miring */
FT(S,{sw:0},{sw:.6,duration:.6},8.0);
FT(S,{sel:0},{sel:1247500,duration:.8,ease:'power2.out'},7.5);
FT(S,{scr:0},{scr:1,duration:.3},8.0); FT(S,{scr:1},{scr:0,duration:.3},10.4);
FT(S,{clk:0},{clk:85,duration:2.8,ease:'power1.in'},7.5);                              /* begadang: jam berjalan */
memoOut('#m2',10.35); FT('#clock',{opacity:1},{opacity:0,duration:.4},10.5);

/* ============ ADEGAN 3 (10,5-15,6): LIMA KOMPONEN ============ */
memoIn('#m3',10.5); wordsIn(K3,10.62,{st:.1}); wordsIn(A3,11.6,{st:.16,dur:.5}); wordsIn(B3,13.9,{st:.14});
const SELSTEP=[960000,702500,451000,268500,125000], THSTEP=[7.5,6,4.5,3,2];
CD.forEach((c,k)=>{ const at=11.75+.55*k;
  FT(c,{f:0},{f:1,duration:.5,ease:'power2.in'},at);
  FT(S,{sel:k?SELSTEP[k-1]:1247500},{sel:SELSTEP[k],duration:.35,ease:'power2.out'},at+.5);
  FT(S,{th:k?THSTEP[k-1]:9},{th:THSTEP[k],duration:.5,ease:'back.out(2)'},at+.5); });
FT(S,{sw:.6},{sw:.15,duration:1.2},13.5);
memoOut('#m3',15.55);

/* ============ ADEGAN 4 (15,6-20): SATU BARIS, HARUS NOL ============ */
FT('#cap',{opacity:0,y:-20},{opacity:1,y:0,duration:.4,ease:'back.out(1.5)'},15.75); FT('#c4',{opacity:0},{opacity:1,duration:.01},15.75); wordsIn(C4,15.85,{st:.14});
FT('#xl',{opacity:0,y:40,scale:.94},{opacity:1,y:0,scale:1,duration:.5,ease:'back.out(1.5)'},16.2);
FT('#xsel',{backgroundColor:'rgba(245,200,75,0)'},{backgroundColor:'rgba(245,200,75,.45)',duration:.35},17.3);
FT('#xsel',{scale:1},{scale:1.03,duration:.25,yoyo:true,repeat:1,ease:'sine.inOut'},18.2);   /* "selisih," */
FT(S,{sel:125000},{sel:0,duration:.55,ease:'power3.out'},19.0);                                 /* "harus NOL." */
FT(S,{th:2},{th:0,duration:1.3,ease:'elastic.out(1,0.3)'},19.06);
FT(S,{sw:.15},{sw:0,duration:.6},19.06);
FT(S,{nt:1},{nt:0,duration:1.3,ease:'power2.inOut'},19.15);                                  /* malam terangkat */
FT('#sweep',{opacity:0},{opacity:1,duration:.01},19.28); FT('#sweep',{x:-420},{x:1500,duration:1.1,ease:'power1.inOut'},19.3);
FT(S,{ok:0},{ok:1,duration:.3},19.5);

/* ============ ADEGAN 5 (20,2-23,8): BELUM NOL? ============ */
FT('#c4',{opacity:1},{opacity:0,duration:.25},20.05); FT('#c5',{opacity:0},{opacity:1,duration:.01},20.2);
FT('#cap',{minHeight:84},{minHeight:128,duration:.3},20.1);
wordsIn(C5,20.27,{st:.16,dur:.45});
FT(S,{ok:1},{ok:0,duration:.2},20.25); FT(S,{sel:0},{sel:75000,duration:.35,ease:'power2.out'},20.3);
FT(S,{th:0},{th:1.6,duration:.6,ease:'back.out(2)'},20.3);
FT(S,{sel:75000},{sel:0,duration:.45,ease:'power2.out'},22.6); FT(S,{th:1.6},{th:0,duration:.9,ease:'elastic.out(1,0.35)'},22.6);
FT(S,{ok:0},{ok:1,duration:.3},22.95);
FT(['#cap','#xl'],{opacity:1,y:0},{opacity:0,y:-24,duration:.3,ease:'power2.in'},23.8);

/* ============ ADEGAN 6 (24,1-29,3): PRODUK SEKILAS ============ */
memoIn('#m6',24.15);
FT('#m6',{height:126},{height:330,duration:.4,ease:'power2.inOut'},27.2);
FT('#m6 .big',{opacity:0,y:20},{opacity:1,y:0,duration:.4,ease:'back.out(1.6)'},27.3);
FT(S,{cnt:0},{cnt:172,duration:1.5,ease:'power1.inOut'},27.4);
FT('#m6 .kt',{opacity:0,y:16},{opacity:1,y:0,duration:.4},28.4);
memoOut('#m6',29.3);

/* ============ ADEGAN 7 (29,5-33,9): HASIL + TOMBOL ============ */
memoIn('#m7',29.5); wordsIn(A7,29.6,{st:.26,dur:.5});
FT('#cta',{opacity:0,y:240,scale:.9},{opacity:1,y:0,scale:1,duration:.7,ease:'back.out(1.7)'},32.3);
FT('#cta',{scale:1},{scale:1.035,duration:.4,ease:'sine.inOut',repeat:1,yoyo:true},33.05);
tl.to({},{duration:.01},DUR);

/* ============ RENDER ============ */
const night=$('#night'), clk=$('#clk'), xr2=$('#xr2'), xr3=$('#xr3'), xsel=$('#xsel'), bign=$('#bign');
const fmt=v=>Math.round(v).toString().replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const hash=n=>{ let x=Math.sin(n*12.9898)*43758.5453; return x-Math.floor(x); };
let lastSel=null, lastCnt=-1;
function render(t){
  const th=S.th+S.sw*Math.sin(t*2.4)+.22*Math.sin(t*.9), r=th*Math.PI/180;
  const Lx=PX-ARM*Math.cos(r), Ly=PY-ARM*Math.sin(r), Rx=PX+ARM*Math.cos(r), Ry=PY+ARM*Math.sin(r);
  beam.setAttribute('transform',`rotate(${th.toFixed(3)} ${PX} ${PY})`);
  needle.setAttribute('transform',`rotate(${Math.max(-42,Math.min(42,th*3.4)).toFixed(3)} ${PX} ${PY})`);
  const pLy=Ly+CHAIN, pRy=Ry+CHAIN;
  panL.setAttribute('transform',`translate(${Lx.toFixed(1)} ${pLy.toFixed(1)})`); panR.setAttribute('transform',`translate(${Rx.toFixed(1)} ${pRy.toFixed(1)})`);
  [[Lx,Ly,Lx-132,pLy],[Lx,Ly,Lx+132,pLy],[Rx,Ry,Rx-132,pRy],[Rx,Ry,Rx+132,pRy]].forEach((c,i)=>{ const e=chains[i]; e.setAttribute('x1',c[0].toFixed(1)); e.setAttribute('y1',c[1].toFixed(1)); e.setAttribute('x2',c[2].toFixed(1)); e.setAttribute('y2',c[3].toFixed(1)); });
  CARDS.forEach((g,k)=>{ const f=CD[k].f, [ox,side]=DOCK[k]; const bx=(side==='L'?Lx:Rx)+ox, by=(side==='L'?pLy:pRy)-46;
    const sx=bx+(side==='L'?-140:140), sy=-160; const x=sx+(bx-sx)*f, y=sy+(by-sy)*f, rot=(1-f)*(side==='L'?-30:30);
    g.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${rot.toFixed(2)})`); g.setAttribute('opacity',f>0?1:0); });
  night.style.opacity=S.nt.toFixed(3);
  /* jam: 23.47 + menit */
  const m=Math.round(S.clk), tot=(23*60+47+m)%(24*60); clk.textContent=String(Math.floor(tot/60)).padStart(2,'0')+'.'+String(tot%60).padStart(2,'0');
  /* angka selisih (bergetar saat dicari) */
  let v=S.sel; if(S.scr>0) v+=S.scr*(hash(Math.floor(t*14))-.5)*240000; v=Math.max(0,Math.round(v/500)*500);
  if(v!==lastSel){ rd.textContent='Rp '+fmt(v); rd.setAttribute('fill',v>0?'#FF8A80':'#7FD3DA'); xr3.textContent=fmt(v); xr2.textContent=fmt(4820000000-v);
    xr3.style.color=v>0?'#C8463D':'#0E7C86'; lastSel=v; }
  xr3.textContent=(S.sel<0.5&&S.ok>.5?'0 ✓':fmt(v));
  const cn=Math.round(S.cnt); if(cn!==lastCnt){ bign.textContent=cn; lastCnt=cn; }
}

/* ============ PEREKAT ============ */
const stage=$('#stage');
const fit=()=>{ const sc=Math.min(innerWidth/W,innerHeight/H); stage.style.transform=`translate(-50%,-50%) scale(${sc})`; };
addEventListener('resize',fit); fit();
const clock=$('#clock2'),scrub=$('#scrub'),btn=$('#btn-play'); let scrubbing=false;
(function frame(){ const t=tl.time(); render(t); clock.textContent=t.toFixed(2)+'s'; if(!scrubbing)scrub.value=String(t/DUR*1000); requestAnimationFrame(frame); })();
const toggle=()=>{ if(tl.paused()||tl.progress()>=1){ if(tl.progress()>=1)tl.progress(0); tl.play(); btn.textContent='Pause'; } else { tl.pause(); btn.textContent='Play'; } };
btn.onclick=toggle; $('#btn-restart').onclick=()=>{ tl.pause(0); tl.play(); btn.textContent='Pause'; };
scrub.addEventListener('pointerdown',()=>{scrubbing=true;tl.pause();btn.textContent='Play';});
addEventListener('pointerup',()=>scrubbing=false);
scrub.addEventListener('input',()=>{tl.pause();tl.time(scrub.value/1000*DUR);});
addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();toggle();} if(/^[rR]$/.test(e.key)){tl.pause(0);tl.play();} if(/^[hH]$/.test(e.key))$('#ui').classList.toggle('on'); });
if(Q.has('debug'))$('#ui').classList.add('on');
const vo=$('#vo'), snd=$('#snd'); let soundOn=false;
if(Q.has('clean')) snd.style.display='none';
const setSound=on=>{ soundOn=on; snd.classList.toggle('on',on); snd.innerHTML=on?'&#9632;&#xFE0E; Suara menyala':'&#9654;&#xFE0E; Dengan suara';
  if(on){ vo.currentTime=Math.min(tl.time(),vo.duration||DUR); const p=vo.play(); if(p&&p.catch)p.catch(()=>setSound(false)); } else vo.pause(); };
snd.onclick=()=>{ if(!soundOn){ if(tl.paused()||tl.progress()>=1){ tl.pause(0); tl.play(); btn.textContent='Pause'; } } setSound(!soundOn); };
(function sync(){ if(soundOn&&!tl.paused()&&Math.abs(vo.currentTime-tl.time())>.1) vo.currentTime=tl.time(); requestAnimationFrame(sync); })();
tl.eventCallback('onComplete',()=>{ tl.play(0); if(soundOn){ vo.currentTime=0; vo.play().catch(()=>{}); } });
const seek=t=>{ tl.pause(); tl.time(t,false); if(gsap.ticker.tick)gsap.ticker.tick(); render(t); };
window.OPENER={W,H,DURATION:DUR,tl,seek,ready:false};
Promise.all(['700 60px "Space Grotesk"','600 40px "Space Grotesk"','500 30px "Space Grotesk"','500 30px "DM Mono"'].map(f=>document.fonts.load(f)))
  .then(()=>document.fonts.ready).then(()=>{ window.OPENER.ready=true; if(!Q.has('clean'))tl.play(0); });
</script>
</body>
</html>
