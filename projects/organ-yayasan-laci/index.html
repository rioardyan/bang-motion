<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Organ Yayasan Tiga Laci</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<!--
  PROMO META ADS 4:5 (1080x1350), 24 detik, tanpa audio, loop.
  Dikembangkan dari iklan statis pemenang "Setiap organ yayasan punya pegangan kerja yang jelas."
  Naskah: naskah.md · Style brief: style-brief.md
  Konsep B: tiga laci, tiga pegangan. Satu kabinet arsip; tiap organ menarik pegangan lacinya sendiri.
  ?debug=1 = panel scrub · ?clean=1 = tanpa autoplay (potret/export).
  Tiga halaman dokumen (SOP Rapat Pembina, Uraian Tugas Pengurus, Program Pengawasan) dibangun ulang dari kode.
-->
<link rel="stylesheet" href="fonts/fonts.css">
<script src="vendor/gsap.min.js"></script>
<style>
:root{
  --bg:#F3E9D2; --ink:#1B2A2E; --teal:#0E7C86; --teal2:#0A4A52; --brass:#E3B23C; --cream:#FFFBF0; --wood:#B98A55; --yellow:#F5C84B;
  --navy:#1D2B53; --green:#2E6B45; --brown:#6A4526;
  --serif:'Fraunces',Georgia,serif; --ui:'Figtree',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:var(--ui)}
#stage{position:fixed;left:50%;top:50%;width:1080px;height:1350px;transform:translate(-50%,-50%) scale(1);overflow:hidden;background:var(--bg)}

/* ---------- DUNIA (kamera) ---------- */
#world{position:absolute;left:0;top:0;width:1080px;height:1350px;transform-origin:0 0}
#wall{position:absolute;left:-1200px;top:-1400px;width:3480px;height:2644px;background:linear-gradient(180deg,#F8F1E0 0,#F3E9D2 1400px,#E9DABA 2644px)}
#win{position:absolute;left:60px;top:-300px;width:560px;height:820px;transform-origin:50% 50%;
  background:linear-gradient(90deg,rgba(255,253,238,.62) 0 47%,transparent 47% 53%,rgba(255,253,238,.62) 53% 100%);
  -webkit-mask:linear-gradient(180deg,#000 0 46%,transparent 46% 52%,#000 52% 100%);mask:linear-gradient(180deg,#000 0 46%,transparent 46% 52%,#000 52% 100%)}
#dado{position:absolute;left:-1200px;top:1000px;width:3480px;height:244px;background:linear-gradient(#DCC49A,#CDB083)}
#dado:before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:linear-gradient(#C99B62,#B98A55)}
#floor{position:absolute;left:-1200px;top:1244px;width:3480px;height:1200px;
  background:repeating-linear-gradient(90deg,transparent 0 158px,rgba(60,35,10,.10) 158px 160px),linear-gradient(#CFA166,#A8794A)}
#floor:before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:rgba(255,245,215,.55)}
#fsh{position:absolute;left:190px;top:1236px;width:700px;height:46px;background:radial-gradient(ellipse at 50% 40%,rgba(50,30,10,.45),transparent 70%)}

#cab{position:absolute;left:0;top:0;width:1080px;height:1350px}
#cabBody{position:absolute;left:220px;top:540px;width:640px;height:704px;border-radius:10px 10px 3px 3px;
  background:linear-gradient(90deg,#10858F 0,#0E7C86 91%,#0A6068 91%);box-shadow:20px 16px 44px rgba(60,40,15,.30)}
#cabTop{position:absolute;left:200px;top:518px;width:680px;height:32px;border-radius:8px;background:linear-gradient(#1BA8B4,#12929D)}
#cabTop:after{content:"";position:absolute;left:10px;right:10px;top:4px;height:3px;border-radius:2px;background:rgba(255,255,255,.4)}
#cabBase{position:absolute;left:214px;top:1214px;width:652px;height:30px;background:var(--teal2);border-radius:0 0 3px 3px}
.dw{position:absolute;left:250px;width:580px;height:170px}
.slot{position:absolute;inset:0;border-radius:6px;background:linear-gradient(#04252B,#08343B);overflow:hidden}
.tabs{position:absolute;left:0;top:0;width:580px;height:56px}
.tab{position:absolute;top:0;border-radius:0 0 4px 4px;background:var(--cream);border:2px solid rgba(0,0,0,.18);border-top:0}
.fr{position:absolute;inset:0;border-radius:6px;background:linear-gradient(180deg,#15A0AC,#10909B 60%,#0E8691);
  box-shadow:0 6px 10px rgba(0,0,0,.18),inset 0 0 0 5px rgba(8,80,88,.55);transform-origin:50% 0}
.plate{position:absolute;left:130px;top:18px;width:320px;height:70px;border-radius:8px;background:var(--cream);box-shadow:inset 0 0 0 3px rgba(27,42,46,.14);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0}
.plate b{font:800 31px/1 var(--serif);letter-spacing:.06em;color:var(--c)}
.plate span{font:700 25px/1 var(--ui);color:var(--ink);height:0;overflow:hidden;opacity:0}
.hnd{position:absolute;left:190px;top:128px;width:200px;height:26px;border-radius:13px;background:linear-gradient(#F7DB86,#E3B23C 55%,#B88A22);box-shadow:0 5px 8px rgba(0,0,0,.28)}
.hnd:before{content:"";position:absolute;left:14px;right:14px;top:4px;height:5px;border-radius:3px;background:rgba(255,255,255,.65)}
.glow{position:absolute;left:150px;top:98px;width:280px;height:86px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,230,130,.95),rgba(255,230,130,0) 70%);opacity:0}

/* ---------- LAYAR (di luar kamera) ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
.w{display:inline-block;opacity:0}
.em{color:var(--teal)}
#chip{position:absolute;left:60px;top:54px;display:flex;align-items:center;gap:14px;padding:12px 24px 12px 16px;border-radius:14px;background:var(--yellow);color:var(--ink);
  font:700 25px var(--ui);letter-spacing:.015em;text-transform:uppercase;opacity:0;box-shadow:0 5px 0 rgba(27,42,46,.25)}
#chip svg{width:44px;height:34px;flex:none}
#hl{position:absolute;left:60px;top:150px;width:980px;font:800 80px/1.04 var(--serif);color:var(--ink);letter-spacing:-.015em}
#hl .ln{display:block}
.pn{position:absolute;left:44px;top:60px;width:490px;padding:26px 30px 30px;border-radius:22px;background:var(--cream);box-shadow:0 14px 0 var(--c),0 26px 44px rgba(60,40,15,.25);opacity:0}
.pn .hd{display:flex;align-items:center;gap:20px;margin-bottom:20px}
.pn .ic{width:84px;height:84px;border-radius:50%;background:var(--c);display:flex;align-items:center;justify-content:center;flex:none}
.pn .ic svg{width:46px;height:46px}
.pn .nm{font:800 52px/1 var(--serif);color:var(--c);letter-spacing:.03em}
.pn .tx{border-top:4px solid var(--c);padding-top:18px;font:600 38px/1.18 var(--ui);color:var(--ink)}
.pn .tx .ln{display:block;margin-bottom:6px}
.doc{position:absolute;left:0;top:0;width:460px;height:560px;margin:-280px 0 0 -230px;border-radius:14px;background:#FFFEF8;overflow:hidden;opacity:0;
  box-shadow:0 30px 60px rgba(40,25,5,.38),0 0 0 2px rgba(27,42,46,.08)}
.doc .dh{height:104px;padding:0 26px;background:var(--c);color:#fff;display:flex;align-items:center;font:800 29px/1.04 var(--serif);text-transform:uppercase;letter-spacing:.012em}
.doc .db{padding:14px 24px}
.rw{position:relative;display:flex;align-items:center;gap:16px;height:84px;padding:0 14px;border-bottom:2px solid #EEF0EC;font:600 26px var(--ui);color:var(--ink);background:rgba(0,0,0,0)}
.rw s{flex:1;height:12px;border-radius:6px;background:#DDE1DD;min-width:30px}
.rw .mk{position:absolute;left:0;top:8px;bottom:8px;width:8px;border-radius:4px;background:var(--c);opacity:0}
.rw i{font:700 24px var(--ui);font-style:normal;color:var(--c);width:30px;flex:none}
.rw u{flex:none;width:44px;height:44px;border-radius:50%;background:var(--c);color:#fff;font:700 24px/44px var(--ui);text-decoration:none;text-align:center}
.rw .cb{flex:none;width:46px;height:46px;border-radius:8px;border:4px solid var(--c);display:flex;align-items:center;justify-content:center}
.rw .cb svg{width:30px;height:30px;opacity:0}
.rw .two{flex:1;display:flex;flex-direction:column;gap:12px}
.rw .two s{flex:none;height:12px} .rw .two s+s{width:60%}
#sub{position:absolute;left:60px;top:64px;width:960px;font:600 50px/1.14 var(--ui);color:var(--ink)}
#sub .ln{display:block}
#sub .ln+.ln{margin-top:20px}
#cta{position:absolute;left:150px;top:1196px;width:780px;height:104px;border-radius:52px;background:var(--teal2);color:var(--cream);display:flex;align-items:center;justify-content:center;gap:22px;
  font:800 46px var(--serif);letter-spacing:.005em;opacity:0;box-shadow:0 10px 0 #06323a,0 26px 40px rgba(40,25,5,.35)}
#cta i{width:66px;height:66px;border-radius:50%;background:var(--brass);display:flex;align-items:center;justify-content:center;flex:none}
#cta svg{width:38px;height:38px}

#ui{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:none;align-items:center;gap:12px;padding:9px 14px;border-radius:12px;background:rgba(14,16,22,.9);font:13px var(--ui);color:#A0A6B4;z-index:50}
#ui.on{display:flex} #ui button{background:#262A34;color:#fff;border:0;padding:6px 12px;border-radius:8px;font:inherit;cursor:pointer}
#scrub{width:320px} #clock{font-variant-numeric:tabular-nums;min-width:5ch;text-align:right}
</style>
</head>
<body>
<div id="stage">
  <div id="world">
    <div id="wall"></div><div id="win"></div>
    <div id="dado"></div><div id="floor"></div><div id="fsh"></div>
    <div id="cab">
      <div id="cabBody"></div><div id="cabTop"></div><div id="cabBase"></div>
    </div>
  </div>

  <div id="hud">
    <div id="chip"><svg viewBox="0 0 44 34" fill="#1B2A2E"><circle cx="22" cy="9" r="6.5"/><path d="M10 30c0-6.500 5-10 12-10s12 3.500 12 10z"/><circle cx="7.500" cy="13" r="4.500"/><path d="M0 28c0-4.500 3-7.500 7.500-7.500 1.200 0 2.200.2 3.200.6-2.200 1.800-3.200 4.200-3.200 6.900z"/><circle cx="36.500" cy="13" r="4.500"/><path d="M44 28c0-4.500-3-7.500-7.500-7.500-1.200 0-2.200.2-3.200.6 2.200 1.800 3.200 4.200 3.200 6.900z"/></svg>Khusus Pembina, Pengurus &amp; Pengawas Yayasan</div>
    <div id="hl">
      <span class="ln" id="h1" data-t="Setiap organ yayasan"></span>
      <span class="ln" id="h2" data-t="punya *pegangan *kerja|*yang *jelas."></span>
    </div>
    <div id="sub">
      <span class="ln" id="s1" data-t="Lengkap dengan SOP, uraian tugas,|alur keputusan,"></span>
      <span class="ln" id="s2" data-t="dan formulir serta berita acara|yang sudah disusun."></span>
    </div>
    <div id="pnl"></div>
    <div id="docs"></div>
    <div id="cta"><span>Lihat Sistem Kerjanya</span><i><svg viewBox="0 0 38 38" fill="none" stroke="#1B2A2E" stroke-width="5.500" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19h26M21 8l11 11-11 11"/></svg></i></div>
  </div>
</div>
<div id="ui"><button id="btn-play">Pause</button><button id="btn-restart">Restart</button>
  <input type="range" id="scrub" min="0" max="1000" value="0"><span id="clock">0.00s</span></div>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const Q=new URLSearchParams(location.search);
const W=1080,H=1350,DUR=24;
const tl=gsap.timeline({paused:true});
const FT=(tg,f,t,at)=>tl.fromTo(tg,f,Object.assign({immediateRender:false},t),at);

/* ============ DATA ============ */
const YT=[592,818,1044];                       /* atas tiap laci (dunia) */
const CNT=[12,15,10];                          /* jumlah dokumen kategori B, C, D */
const NAME=['PEMBINA','PENGURUS','PENGAWAS'];
const COLV=['#1D2B53','#2E6B45','#6A4526'];
const LINES=[['Panduan rapat,','mekanisme keputusan,','dan format pengesahan.'],['Uraian tugas,','SOP kerja,','dan alur persetujuan.'],['Program pemeriksaan,','format laporan,','dan mekanisme tindak lanjut.']];
const ICON=[
 '<svg viewBox="0 0 46 46" fill="#FFF9E6"><circle cx="23" cy="14" r="7.500"/><path d="M9 38c0-8.500 6-13 14-13s14 4.500 14 13z"/><circle cx="9" cy="18" r="5"/><circle cx="37" cy="18" r="5"/></svg>',
 '<svg viewBox="0 0 46 46" fill="#FFF9E6"><circle cx="23" cy="13" r="8"/><path d="M8 40c0-9 6.500-14 15-14s15 5 15 14z"/><path d="M21 27h4l1.500 8-3.500 3-3.500-3z" fill="#2E6B45"/></svg>',
 '<svg viewBox="0 0 46 46" fill="none" stroke="#FFF9E6" stroke-width="5" stroke-linecap="round"><circle cx="20" cy="20" r="11.500"/><path d="M29 29l11 11"/></svg>'];

/* ============ STATE (fungsi murni dari t) ============ */
const S={cs:1,cx:540,cy:675,ay:675,n1:0,n2:0,n3:0};
const O=[{o:0},{o:0},{o:0}];                   /* laci terbuka 0..1 */
const U=[{u:0},{u:0},{u:0}];                   /* dokumen terbit 0..1 */
const CAMS={ov:{cs:1,cx:540,cy:675,ay:675},d0:{cs:1.12,cx:540,cy:677,ay:1030},d1:{cs:1.12,cx:540,cy:903,ay:1030},d2:{cs:1.12,cx:540,cy:1129,ay:1030},fin:{cs:.92,cx:540,cy:700,ay:640}};
let curCam='ov';
function cam(to,at,dur,ease='power3.inOut'){ FT(S,Object.assign({},CAMS[curCam]),Object.assign({},CAMS[to],{duration:dur,ease}),at); curCam=to; }

/* ============ BANGUN LACI ============ */
const cab=$('#cab'); const DR=[];
YT.forEach((y,i)=>{
  const dw=document.createElement('div'); dw.className='dw'; dw.style.top=y+'px'; dw.style.zIndex=10-i; dw.style.setProperty('--c',COLV[i]);
  const n=CNT[i], tw=580/n; let tabs='';
  for(let j=0;j<n;j++){ const h=36+((j*7+i*3)%4)*5; tabs+=`<i class="tab" style="left:${(j*tw+2).toFixed(1)}px;width:${(tw-4).toFixed(1)}px;height:${h}px;${j%3===1?`background:${COLV[i]};border-color:rgba(0,0,0,.25);`:''}"></i>`; }
  dw.innerHTML=`<div class="slot"><div class="tabs">${tabs}</div></div>
   <div class="fr"><div class="plate"><b>${NAME[i]}</b><span id="pc${i}">0 dokumen</span></div><div class="glow"></div><div class="hnd"></div></div>`;
  cab.appendChild(dw);
  DR.push({dw,fr:$('.fr',dw),tabs:$$('.tab',dw),glow:$('.glow',dw),plate:$('.plate',dw),pc:$('#pc'+i,dw)});
});

/* ============ PANEL TEKS + DOKUMEN ============ */
const pnl=$('#pnl'), docsEl=$('#docs'); const PN=[], DOCEL=[], LW=[], ROWS=[];
const CHECK='<svg viewBox="0 0 30 30" fill="none" stroke="#2E6B45" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 16l7 7 13-15"/></svg>';
const DOCHTML=[
 {t:'SOP Rapat Pembina Yayasan',rows:['Tujuan','Ruang Lingkup','Prosedur','Formulir Terkait','Penanggung Jawab'].map((x,k)=>`<div class="rw"><b class="mk"></b><i>${k+1}.</i><span>${x}</span><s></s></div>`).join('')},
 {t:'Uraian Tugas Pengurus Yayasan',rows:[0,1,2,3,4].map(k=>`<div class="rw"><b class="mk"></b><u>${k+1}</u><div class="two"><s></s><s></s></div></div>`).join('')},
 {t:'Program Pengawasan',rows:[0,1,2,3].map(k=>`<div class="rw" style="height:104px"><b class="mk"></b><span class="cb">${CHECK}</span><div class="two"><s></s><s></s></div></div>`).join('')}
];
for(let i=0;i<3;i++){
  const p=document.createElement('div'); p.className='pn'; p.style.setProperty('--c',COLV[i]);
  p.innerHTML=`<div class="hd"><div class="ic">${ICON[i]}</div><div class="nm">${NAME[i]}</div></div><div class="tx">${LINES[i].map(l=>`<span class="ln">${l}</span>`).join('')}</div>`;
  pnl.appendChild(p); PN.push(p);
  const d=document.createElement('div'); d.className='doc'; d.style.setProperty('--c',COLV[i]);
  d.innerHTML=`<div class="dh">${DOCHTML[i].t}</div><div class="db">${DOCHTML[i].rows}</div>`; docsEl.appendChild(d); DOCEL.push(d);
  ROWS.push($$('.rw',d));
}

/* teks per kata */
function words(e){ e.innerHTML=e.dataset.t.split('|').map(l=>l.trim().split(/\s+/).map(w=>{ const em=w[0]==='*'; return `<span class="w${em?' em':''}">${em?w.slice(1):w}</span>`; }).join(' ')).join('<br>'); return $$('.w',e); }
const H1=words($('#h1')), H2=words($('#h2')), S1=words($('#s1')), S2=words($('#s2'));
const LW_=PN.map(p=>$$('.ln',p).map(l=>{ const t=l.textContent; l.innerHTML=t.split(' ').map(w=>`<span class="w">${w}</span>`).join(' '); return $$('.w',l); }));
const wordsIn=(ws,at,o={})=>FT(ws,{opacity:0,y:o.y??30},{opacity:1,y:0,duration:o.dur??.5,ease:o.ease??'back.out(1.6)',stagger:o.st??.08},at);
const fadeOut=(sel,at,d=.35,y=-24)=>FT(sel,{opacity:1,y:0},{opacity:0,y:y,duration:d,ease:'power2.in'},at);

/* tab folder tersembunyi sampai laci terbuka */
DR.forEach(d=>tl.set(d.tabs,{y:56},0));

/* ============ ADEGAN 1 (0-4): JANJI ============ */
FT('#cabBody,#cabTop,#cabBase,#fsh',{opacity:0,y:50},{opacity:1,y:0,duration:.7,ease:'power3.out'},0);
DR.forEach((d,i)=>FT(d.dw,{opacity:0,y:40},{opacity:1,y:0,duration:.6,ease:'back.out(1.5)'},.15+.12*i));
FT('#chip',{opacity:0,y:-26,scale:.92},{opacity:1,y:0,scale:1,duration:.5,ease:'back.out(1.7)'},.05);
wordsIn(H1,.4,{st:.12,dur:.55});
wordsIn(H2,1.6,{st:.1,dur:.6,ease:'back.out(1.8)'});
DR.forEach((d,i)=>FT(d.glow,{opacity:0},{opacity:1,duration:.28,ease:'power2.out',repeat:1,yoyo:true},2.35+.55*i));
fadeOut('#hl',3.45,.4); fadeOut('#chip',3.45,.4);

/* ============ ADEGAN 2-4 (4-19): SATU LACI, SATU ORGAN ============ */
for(let k=0;k<3;k++){
  const T=4+5*k;                                 /* awal adegan; kamera mulai T-0.4 */
  cam('d'+k,T-.4,1.0);
  FT(DR[k].glow,{opacity:0},{opacity:1,duration:.25,repeat:1,yoyo:true},T+.35);
  FT(O[k],{o:0},{o:1,duration:.7,ease:'power4.out'},T+.7);
  FT(DR[k].tabs,{y:56},{y:0,duration:.45,ease:'back.out(1.4)',stagger:.03},T+.8);
  FT(PN[k],{opacity:0,x:-620},{opacity:1,x:0,duration:.65,ease:'back.out(1.35)'},T+.85);
  FT(U[k],{u:0},{u:1,duration:.75,ease:'back.out(1.25)'},T+.95);
  LW_[k].forEach((ws,j)=>wordsIn(ws,T+1.35+1.15*j,{st:.07,dur:.4,y:20}));
  /* isi dokumen menyala satu per satu */
  ROWS[k].forEach((r,j)=>{
    const mk=$('.mk',r);
    const tint=['rgba(29,43,83,.11)','rgba(46,107,69,.12)','rgba(106,69,38,.12)'][k], tint0=tint.replace(/[\d.]+\)$/,'0)');
    FT(r,{backgroundColor:tint0},{backgroundColor:tint,duration:.3,ease:'power2.out'},T+2.0+.45*j);
    FT(mk,{opacity:0},{opacity:1,duration:.3},T+2.0+.45*j);
    if(k===2){ const sv=$('.cb svg',r); FT(sv,{opacity:0,scale:.3},{opacity:1,scale:1,duration:.35,ease:'back.out(2.6)'},T+2.1+.45*j); }
  });
  /* keluar: dokumen kembali ke laci, laci menutup */
  FT(U[k],{u:1},{u:0,duration:.45,ease:'power3.in'},T+4.0);
  FT(PN[k],{opacity:1,y:0},{opacity:0,y:-30,duration:.35,ease:'power2.in'},T+4.05);
  FT(O[k],{o:1},{o:0,duration:.5,ease:'power3.inOut'},T+4.2);
  tl.set(DR[k].tabs,{y:56},T+4.75);            /* setel ulang sesudah laci tertutup */
}

/* ============ ADEGAN 5 (18,6-22,4): LENGKAP ============ */
cam('ov',18.6,1.0);
FT(O[0],{o:0},{o:1,duration:.7,ease:'power4.out'},19.3);
FT(O[1],{o:0},{o:1,duration:.7,ease:'power4.out'},19.45);
FT(O[2],{o:0},{o:1,duration:.7,ease:'power4.out'},19.6);
DR.forEach((d,i)=>{
  FT(d.tabs,{y:56},{y:0,duration:.4,ease:'back.out(1.4)',stagger:.025},19.55+.15*i);
  FT(d.plate,{height:70},{height:98,duration:.3,ease:'power2.out'},19.9);
});
wordsIn(S1,19.2,{st:.08,dur:.5}); wordsIn(S2,21.0,{st:.08,dur:.5});
FT(S,{n1:0},{n1:12,duration:1.2,ease:'power1.inOut'},19.9);
FT(S,{n2:0},{n2:15,duration:1.2,ease:'power1.inOut'},19.9);
FT(S,{n3:0},{n3:10,duration:1.2,ease:'power1.inOut'},19.9);
fadeOut('#sub',22.35,.35);

/* ============ ADEGAN 6 (22,4-24): AJAKAN ============ */
[0,1,2].forEach(i=>FT(O[i],{o:1},{o:0,duration:.5,ease:'power3.inOut'},22.45+.12*i));
cam('fin',22.6,.9);
FT('#hl',{opacity:0,y:30},{opacity:1,y:0,duration:.5,ease:'power2.out'},22.55);
FT('#cta',{opacity:0,y:260,scale:.9},{opacity:1,y:0,scale:1,duration:.75,ease:'back.out(1.7)'},23.0);
FT('#cta',{scale:1},{scale:1.035,duration:.4,ease:'sine.inOut',repeat:1,yoyo:true},23.65);
tl.to({},{duration:.01},DUR);

/* ============ RENDER ============ */
const world=$('#world'), win=$('#win');
const lerp=(a,b,u)=>a+(b-a)*u;
const ORG={x:540,y:1030-60*1.12}, READ={x:790,y:372};
const CNTSET=[0,0,0];
function render(t){
  world.style.transform=`translate(${(540-S.cx*S.cs).toFixed(2)}px,${(S.ay-S.cy*S.cs).toFixed(2)}px) scale(${S.cs.toFixed(4)})`;
  win.style.transform=`translateX(${(30*Math.sin(t*.22)).toFixed(1)}px) skewX(-12deg)`;
  win.style.opacity=(.85+.15*Math.sin(t*.35)).toFixed(3);
  DR.forEach((d,i)=>{ const o=O[i].o;
    d.fr.style.transform=`translateY(${(50*o).toFixed(2)}px) scale(${(1+.05*o).toFixed(4)})`;
    d.fr.style.boxShadow=`0 ${(6+16*o).toFixed(1)}px ${(10+22*o).toFixed(1)}px rgba(0,0,0,${(.18+.17*o).toFixed(3)}),inset 0 0 0 5px rgba(8,80,88,.55)`;
    const u=U[i].u, el=DOCEL[i];
    el.style.opacity=Math.max(0,Math.min(1,u*6)).toFixed(3);
    el.style.transform=`translate(${lerp(ORG.x,READ.x,u).toFixed(1)}px,${lerp(ORG.y,READ.y,u).toFixed(1)}px) rotate(${lerp(-8,2,u).toFixed(2)}deg) scale(${lerp(.2,1,u).toFixed(4)})`;
  });
  const ns=[S.n1,S.n2,S.n3];
  ns.forEach((v,i)=>{ const n=Math.round(v); if(n!==CNTSET[i]){ DR[i].pc.textContent=n+' dokumen'; CNTSET[i]=n; } });
  /* label jumlah baru terlihat saat plat melebar (adegan 5) */
  DR.forEach((d,i)=>{ const sp=d.pc; const show=S.n1>0||S.n2>0||S.n3>0; sp.style.height=show?'27px':'0px'; sp.style.opacity=show?1:0; });
}

/* ============ PEREKAT ============ */
const stage=$('#stage');
const fit=()=>{ const sc=Math.min(innerWidth/W,innerHeight/H); stage.style.transform=`translate(-50%,-50%) scale(${sc})`; };
addEventListener('resize',fit); fit();
const clock=$('#clock'),scrub=$('#scrub'),btn=$('#btn-play'); let scrubbing=false;
(function frame(){ const t=tl.time(); render(t); clock.textContent=t.toFixed(2)+'s'; if(!scrubbing)scrub.value=String(t/DUR*1000); requestAnimationFrame(frame); })();
const toggle=()=>{ if(tl.paused()||tl.progress()>=1){ if(tl.progress()>=1)tl.progress(0); tl.play(); btn.textContent='Pause'; } else { tl.pause(); btn.textContent='Play'; } };
btn.onclick=toggle; $('#btn-restart').onclick=()=>{ tl.pause(0); tl.play(); btn.textContent='Pause'; };
scrub.addEventListener('pointerdown',()=>{scrubbing=true;tl.pause();btn.textContent='Play';});
addEventListener('pointerup',()=>scrubbing=false);
scrub.addEventListener('input',()=>{tl.pause();tl.time(scrub.value/1000*DUR);});
addEventListener('keydown',e=>{ if(e.code==='Space'){e.preventDefault();toggle();} if(/^[rR]$/.test(e.key)){tl.pause(0);tl.play();} if(/^[hH]$/.test(e.key))$('#ui').classList.toggle('on'); });
if(Q.has('debug'))$('#ui').classList.add('on');
tl.eventCallback('onComplete',()=>{tl.play(0);});
const seek=t=>{ tl.pause(); tl.time(t,false); if(gsap.ticker.tick)gsap.ticker.tick(); render(t); };
window.OPENER={W,H,DURATION:DUR,tl,seek,ready:false};
Promise.all(['800 90px "Fraunces"','700 40px "Fraunces"','700 30px "Figtree"','600 30px "Figtree"','500 30px "Figtree"'].map(f=>document.fonts.load(f)))
  .then(()=>document.fonts.ready).then(()=>{ window.OPENER.ready=true; if(!Q.has('clean'))tl.play(0); });
</script>
</body>
</html>
